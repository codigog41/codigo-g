<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CÓDIGO G | Láser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<style>
:root {
    --vino: #86181b;
    --negro: #242124;
    --gris: #6f6969;
    --claro: #f7f5f3;
    --linea: #e8e1df;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: "Open Sans", sans-serif;
    color: var(--negro);
    background: #fff;
    line-height: 1.65;
}
a { color: inherit; text-decoration: none; }
header {
    padding: 22px max(24px, calc((100% - 1120px) / 2));
    border-bottom: 1px solid var(--linea);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}
.marca { color: var(--vino); font-weight: 800; letter-spacing: 1px; }
.volver { font-size: 14px; font-weight: 700; }
.volver:hover { color: var(--vino); }
main { width: min(1120px, calc(100% - 48px)); margin: auto; padding: 70px 0 90px; }
.eyebrow {
    color: var(--vino);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
}
h1 { margin: 10px 0 8px; font-size: clamp(32px, 5vw, 54px); line-height: 1.15; letter-spacing: -1.5px; }
.descripcion { margin: 0 0 34px; color: var(--gris); }
.album {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
}
.foto { margin: 0; overflow: hidden; border-radius: 12px; background: var(--claro); }
.foto img { display: block; width: 100%; height: 300px; object-fit: cover; transition: transform .25s; }
.foto:hover img { transform: scale(1.035); }
footer { padding: 22px; text-align: center; color: var(--gris); font-size: 12px; border-top: 1px solid var(--linea); }
@media (max-width: 800px) {
    .album { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
    header { padding: 18px; }
    main { width: calc(100% - 36px); padding: 48px 0 65px; }
    .album { grid-template-columns: 1fr; }
    .foto img { height: 260px; }
}
</style>
</head>
<body>
<header>
    <a class="marca" href="index.html">CÓDIGO G</a>
    <a class="volver" href="index.html#trabajos">← Volver a trabajos</a>
</header>
<main>
    <span class="eyebrow">Portfolio · CÓDIGO G</span>
    <h1>Láser</h1>
    <p class="descripcion">Corte y grabado de precisión</p>
    <!--
      Para sumar trabajos, duplicá una línea <figure class="foto">...</figure>
      y reemplazá el nombre del archivo por el de tu nueva imagen.
      Guardá las imágenes en la misma carpeta que estos archivos HTML.
    -->
    <section class="album" aria-label="Álbum de trabajos de Láser">
            <figure class="foto"><img src="laser1.jpg" alt="Trabajo láser 1"></figure>
            <figure class="foto"><img src="laser2.jpg" alt="Trabajo láser 2"></figure>
            <figure class="foto"><img src="laser3.jpg" alt="Trabajo láser 3"></figure>
    </section>
</main>
<footer>© <span id="year"></span> CÓDIGO G · Diseños personalizados by DAKAT 3D</footer>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
